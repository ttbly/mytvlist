services:
  iptv-filter:
    build: .
    container_name: mytvlist-filter
    environment:
      - OUTPUT_DIR=/app/data
      - MAX_SAME_CHANNEL_URLS=8
    volumes:
      - iptv_data:/app/data
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: mytvlist-nginx
    depends_on:
      - iptv-filter
    ports:
      - "28024:80"
    volumes:
      - iptv_data:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  iptv_data:
