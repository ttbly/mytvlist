services:
  iptv-filter:
    build: .
    container_name: iptv-filter
    environment:
      OUTPUT_DIR: /app/data
      # 如在国内服务器拉取 GitHub Raw 不稳定，可取消下一行注释并换成你自己的代理。
      # GH_PROXY: https://gh-proxy.example.com/
      CHECK_STREAMS: "0"
      UPDATE_INTERVAL_SECONDS: "21600"
    volumes:
      - iptv_data:/app/data
    command:
      - /bin/sh
      - -c
      - |
        python /app/filter.py
        while true; do
          sleep "$${UPDATE_INTERVAL_SECONDS:-21600}"
          python /app/filter.py
        done
    restart: unless-stopped

  iptv-web:
    image: nginx:alpine
    container_name: iptv-web
    depends_on:
      - iptv-filter
    ports:
      - "28024:80"
    volumes:
      - iptv_data:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  iptv_data:
